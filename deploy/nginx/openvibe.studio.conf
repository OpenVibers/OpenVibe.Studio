## openvibe.studio — reference vhost for ov-vhost-install.
## Studio answers pages and /api/ on 127.0.0.1:5155. The app bundles under /apps/ are static
## files on disk: the WebAssembly needs its own type, and only the hashed files may be cached hard.
limit_req_zone $binary_remote_addr zone=studio_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=studio_api:10m rate=5r/s;

# A bundle file whose name carries a content hash never changes, so it may be cached for a year.
# Every other file keeps its name from release to release and has to be revalidated.
map $uri $studio_cache {
    default                                "no-cache";
    "~^/apps/.+\.part-[0-9a-f]+$"         "public, max-age=31536000, immutable";
    "~^/apps/.+-[0-9a-f]{8,}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.studio www.openvibe.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.studio$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.studio;
    ssl_certificate /etc/letsencrypt/live/openvibe.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.studio/privkey.pem;
    return 301 https://openvibe.studio$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.studio;
    ssl_certificate /etc/letsencrypt/live/openvibe.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.studio/privkey.pem;
    access_log /var/log/nginx/openvibe.studio.access.log;
    error_log /var/log/nginx/openvibe.studio.error.log;
    # The apps run in the browser and a save goes to the OpenVibe APIs, so the body stays small.
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json text/plain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The app bundles: static files under the bundle root. Production keeps them outside the checkout
    # (STUDIO_BUNDLE_ROOT=/var/lib/openvibe-studio/apps, filled by scripts/fetch-bundles.sh) so a deploy's
    # git pull never touches them. The types are listed here because the module is only compiled by the
    # browser when it is served as application/wasm.
    location /apps/ {
        root /var/lib/openvibe-studio;
        types {
            text/html html;
            text/css css;
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            text/plain txt;
            text/xml xml;
            font/otf otf;
            font/woff woff;
            font/woff2 woff2;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/webp webp;
            image/x-icon ico;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control $studio_cache always;
        try_files $uri =404;
    }
    location = /auth/me { limit_req zone=studio_api burst=30 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5155; }
    location /auth/ { limit_req zone=studio_auth burst=10 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5155; }
    location /api/ { limit_req zone=studio_api burst=20 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5155; }
    location ~* ^/(metrics|internal)(/|$) { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location / { proxy_pass http://127.0.0.1:5155; }
}
