name: bundles
# The app bundles are built here, from pinned upstream tags, checked by the first-frame smoke test
# and published as a release the host can fetch without a GitHub account. A bundle is never kept
# in git.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/build-bundles.sh"
      - "scripts/smoke.js"
      - "server/bundle-files.js"
      - "server/bundles.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: check out PhotoCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: v0.21.0
          path: vendor/photocraft
      - name: check out LightCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/lightcraft
          ref: v0.19.0
          path: vendor/lightcraft
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: wasm-bindgen
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo cp /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen* /usr/local/bin/
          wasm-bindgen --version
      - name: build the bundles
        run: scripts/build-bundles.sh all
      - name: smoke test PhotoCraft
        run: node scripts/smoke.js --app photo --dir artifacts/photo
      - name: smoke test LightCraft
        run: node scripts/smoke.js --app light --dir artifacts/light
      - name: checksums
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > bundles.sha256
          cat bundles.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: studio-bundles
          path: |
            artifacts/photo
            artifacts/light
            artifacts/bundles.sha256
          retention-days: 30

  # On main the built bundles become a release the host fetches with curl: no GitHub account and
  # no token are needed there. The assets of an existing release are replaced.
  publish:
    name: publish the bundles release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - uses: actions/download-artifact@v4
        with:
          name: studio-bundles
          path: artifacts
      - name: pack and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PHOTO_TAG="$(node -e "process.stdout.write(require('./server/adapters/photo').base.tag)")"
          LIGHT_TAG="$(node -e "process.stdout.write(require('./server/adapters/light').base.tag)")"
          RELEASE="bundles-${PHOTO_TAG}-${LIGHT_TAG}"
          TARBALL="studio-bundles-${PHOTO_TAG}-${LIGHT_TAG}.tar.gz"
          cd artifacts
          tar -czf "$TARBALL" photo light
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "replacing the assets of $RELEASE"
            gh release upload "$RELEASE" "$TARBALL" SHA256SUMS --clobber
          else
            gh release create "$RELEASE" "$TARBALL" SHA256SUMS --title "$RELEASE" --notes "The app bundles for PhotoCraft ${PHOTO_TAG} and LightCraft ${LIGHT_TAG}. Check SHA256SUMS before unpacking; scripts/fetch-bundles.sh does that on the host."
          fi
